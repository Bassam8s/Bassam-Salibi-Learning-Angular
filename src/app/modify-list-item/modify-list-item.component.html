<form [formGroup]="playerForm" (ngSubmit)="onSubmit()">
  <!--- Id Field -->
  <div>
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id">
  </div>
  <!--- First Name Field -->
  <div>
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" formControlName="firstName">
  </div>
  <!--- Last Name Field -->
  <div>
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" formControlName="lastName">
  </div>
  <!--- Jersey Number Field -->
  <div>
    <label for="jerseyNumber">Jersey Number</label>
    <input type="number" id="jerseyNumber" formControlName="jerseyNumber">
  </div>
  <!--- Is Admin Field -->
  <div>
    <label for="isAdmin">Is Admin</label>
    <input type="checkbox" id="isAdmin" formControlName="isAdmin">
  </div>
  <!--- Submit Button -->
  <button type="submit">Add/Update</button>
</form>
